[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-blender"
version = "0.2.0"
description = "Claude Code MCP server for Blender integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Claude Blender Contributors"}
]
keywords = ["blender", "claude", "mcp", "ai", "3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "mcp>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
claude-blender = "claude_blender_mcp:main"

[project.urls]
Homepage = "https://github.com/minihellboy/claude-blender"
Documentation = "https://github.com/minihellboy/claude-blender#readme"
Repository = "https://github.com/minihellboy/claude-blender"

[tool.setuptools]
packages = ["claude_blender_mcp"]
package-dir = {"claude_blender_mcp" = "claude_blender/claude_blender_mcp"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
